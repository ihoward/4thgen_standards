id: FGP-vymtxo
normalized_name: "open contribution process"

title: Changes are proposed through an open contribution process

description: |
  Any person may propose changes to the standard through a public, structured
  process (such as pull requests). Proposals are visible to all community members.
  The discussion history of every accepted and rejected proposal is permanently
  recorded and publicly accessible. Contribution is not restricted to institutional
  members or invited participants.
